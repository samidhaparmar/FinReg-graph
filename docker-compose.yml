services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finreg
      POSTGRES_USER: finreg
      POSTGRES_PASSWORD: finreg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finreg"]
      interval: 5s
      retries: 10
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      qdrant:
        condition: service_started
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"
volumes:
  pgdata:
  neo4jdata:
  qdrantdata:
  ollamadata:
